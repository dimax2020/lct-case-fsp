name: fsp

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fsp
      - --entrypoints.web.address=:80
      - --api.dashboard=false
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_MOCKS: ${NUXT_PUBLIC_API_MOCKS:-0}
      # Demo-only secrets. nuxt-oidc-auth ignores a session secret shorter than 48 chars.
      NUXT_OIDC_SESSION_SECRET: ${NUXT_OIDC_SESSION_SECRET:-demo-only-oidc-session-secret-not-a-production-key}
      NUXT_OIDC_AUTH_SESSION_SECRET: ${NUXT_OIDC_AUTH_SESSION_SECRET:-demo-only-oidc-auth-session-secret-not-a-production-key}
      NUXT_OIDC_TOKEN_KEY: ${NUXT_OIDC_TOKEN_KEY:-ZnNwLWRlbW8tb2lkYy10b2tlbi1rZXktMzJieXRlcyE=}
      NUXT_PUBLIC_SITE_ORIGIN: ${NUXT_PUBLIC_SITE_ORIGIN:-http://localhost}
      KEYCLOAK_PUBLIC_BASE: ${KEYCLOAK_PUBLIC_BASE:-http://localhost/auth}
      KEYCLOAK_INTERNAL_BASE: ${KEYCLOAK_INTERNAL_BASE:-http://keycloak:8080/auth}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-career-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me}
      NUXT_OIDC_PROVIDERS_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-career-web}
      NUXT_OIDC_PROVIDERS_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me}
      NUXT_OIDC_PROVIDERS_KEYCLOAK_BASE_URL: http://localhost/auth/realms/fsp
      NUXT_OIDC_PROVIDERS_KEYCLOAK_REDIRECT_URI: http://localhost/auth/keycloak/callback
      NUXT_OIDC_PROVIDERS_KEYCLOAK_LOGOUT_REDIRECT_URI: http://localhost/
      NUXT_OIDC_PROVIDERS_KEYCLOAK_AUTHORIZATION_URL: http://localhost/auth/realms/fsp/protocol/openid-connect/auth
      NUXT_OIDC_PROVIDERS_KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/fsp/protocol/openid-connect/token
      NUXT_OIDC_PROVIDERS_KEYCLOAK_USER_INFO_URL: http://keycloak:8080/auth/realms/fsp/protocol/openid-connect/userinfo
      NUXT_OIDC_PROVIDERS_KEYCLOAK_LOGOUT_URL: http://localhost/auth/realms/fsp/protocol/openid-connect/logout
      NUXT_OIDC_PROVIDERS_KEYCLOAK_OPEN_ID_CONFIGURATION: http://keycloak:8080/auth/realms/fsp/.well-known/openid-configuration
      NUXT_OIDC_PROVIDERS_KEYCLOAK_AUDIENCE: career-web
      REDIS_URL: redis://redis:6379/0
      API_PROXY_TARGET: http://api:8000
      NUXT_EPA_PROXY_TARGET: http://epa:8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=3000
      - traefik.http.routers.web-auth.rule=PathPrefix(`/auth/keycloak`) || PathPrefix(`/auth/role`)
      - traefik.http.routers.web-auth.priority=200
      - traefik.http.routers.web-auth.entrypoints=web
      - traefik.http.routers.web-auth.service=web
    networks: [web]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      epa:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: fsp-api
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "0"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_ISSUER: http://localhost/auth/realms/fsp
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/fsp/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: career-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm-provider.example/v1}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL: ${LLM_MODEL:-qwen3-14b}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      PISTON_URL: http://piston:2000
      PISTON_ENABLED: ${PISTON_ENABLED:-false}
      MATCH_ALPHA: ${MATCH_ALPHA:-1.0}
      MATCH_BETA: ${MATCH_BETA:-0.15}
      # Миграции и демо-данные при старте: if-empty — только в пустую базу, always — сброс демо при каждом старте.
      AUTO_MIGRATE: "1"
      SEED_ON_START: ${SEED_ON_START:-if-empty}
      UPLOAD_DIR: /data/uploads
      TAXONOMY_DIR: /srv/taxonomy/data
      ASSESSMENT_BANK: /srv/assessment/bank.json
      ASSESSMENT_COOLDOWN: ${ASSESSMENT_COOLDOWN:-off}
    volumes:
      - ../../taxonomy:/srv/taxonomy:ro
      - ../../seed:/srv/seed:ro
      - ../../tmp_bank:/srv/assessment:ro
      - uploads:/data/uploads
    networks: [web, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  worker:
    image: fsp-api
    command: ["taskiq", "worker", "app.tasks:broker"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm-provider.example/v1}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL: ${LLM_MODEL:-qwen3-14b}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      PISTON_URL: http://piston:2000
      PISTON_ENABLED: ${PISTON_ENABLED:-false}
      UPLOAD_DIR: /data/uploads
      TAXONOMY_DIR: /srv/taxonomy/data
      ASSESSMENT_BANK: /srv/assessment/bank.json
      ASSESSMENT_COOLDOWN: ${ASSESSMENT_COOLDOWN:-off}
    volumes:
      - ../../taxonomy:/srv/taxonomy:ro
      - ../../seed:/srv/seed:ro
      - ../../tmp_bank:/srv/assessment:ro
      - uploads:/data/uploads
    networks: [web, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [web]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      mailpit:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=PathPrefix(`/auth/realms`) || PathPrefix(`/auth/resources`) || PathPrefix(`/auth/admin`) || PathPrefix(`/auth/js`) || PathPrefix(`/auth/health`)
      - traefik.http.routers.auth.priority=100
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [web]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_WEBROOT: /mail
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=PathPrefix(`/mail`)
      - traefik.http.routers.mail.priority=150
      - traefik.http.routers.mail.entrypoints=web
      - traefik.http.services.mail.loadbalancer.server.port=8025
    networks: [web]
    restart: unless-stopped

  epa:
    build:
      context: ../../services/epa
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      EPA_PUBLIC_URL: ${EPA_PUBLIC_URL:-http://localhost}
      EPA_RDE_DRIVER: local
      EPA_SANDBOX_DRIVER: local
      EPA_DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - epa:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.epa.rule=PathPrefix(`/v1`) || PathPrefix(`/git`) || PathPrefix(`/extension`)
      - traefik.http.routers.epa.priority=120
      - traefik.http.routers.epa.entrypoints=web
      - traefik.http.services.epa.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [web]
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    networks: [sandbox]
    mem_limit: 512m
    cpus: "1.0"
    volumes:
      - piston:/piston
    restart: unless-stopped

networks:
  web:
    name: fsp
  sandbox:
    internal: true

volumes:
  pgdata:
  uploads:
  piston:
  epa:
