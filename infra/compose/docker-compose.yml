name: fsp

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fsp
      - --entrypoints.web.address=:80
      - --api.dashboard=false
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_MOCKS: ${NUXT_PUBLIC_API_MOCKS:-1}
      NUXT_OIDC_SESSION_SECRET: ${NUXT_OIDC_SESSION_SECRET:-change-me-session-secret}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks: [web]
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "0"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_ISSUER: http://localhost/auth/realms/fsp
      KEYCLOAK_CLIENT_ID: career-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm-provider.example/v1}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL: ${LLM_MODEL:-qwen3-14b}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      PISTON_URL: http://piston:2000
      PISTON_ENABLED: ${PISTON_ENABLED:-false}
      MATCH_ALPHA: ${MATCH_ALPHA:-1.0}
      MATCH_BETA: ${MATCH_BETA:-0.15}
      UPLOAD_DIR: /data/uploads
      TAXONOMY_DIR: /srv/taxonomy/data
    volumes:
      - ../../taxonomy:/srv/taxonomy:ro
      - ../../seed:/srv/seed:ro
      - uploads:/data/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.priority=100
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
    networks: [web, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "0"
    command: ["taskiq", "worker", "app.tasks:broker"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm-provider.example/v1}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL: ${LLM_MODEL:-qwen3-14b}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      PISTON_URL: http://piston:2000
      PISTON_ENABLED: ${PISTON_ENABLED:-false}
      UPLOAD_DIR: /data/uploads
      TAXONOMY_DIR: /srv/taxonomy/data
    volumes:
      - ../../taxonomy:/srv/taxonomy:ro
      - ../../seed:/srv/seed:ro
      - uploads:/data/uploads
    networks: [web, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [web]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`)
      - traefik.http.routers.auth.priority=100
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8080
    networks: [web]
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    networks: [sandbox]
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped

networks:
  web:
    name: fsp
  sandbox:
    internal: true

volumes:
  pgdata:
  uploads:
