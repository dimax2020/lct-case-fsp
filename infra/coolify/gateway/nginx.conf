# Единая точка входа стенда в Coolify: прокси Coolify (TLS, домен) → gateway:80 → сервисы.
# Повторяет маршруты Traefik из infra/compose/docker-compose.yml.
# Админка Keycloak (/auth/admin) наружу намеренно не публикуется.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# TLS снимает прокси Coolify: сохраняем схему и порт, которые он передал.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_x_forwarded_port $fwd_port {
  default $http_x_forwarded_port;
  ''      $server_port;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 50m;
  large_client_header_buffers 8 64k;
  proxy_buffer_size 128k;
  proxy_buffers 8 256k;
  proxy_busy_buffers_size 256k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $fwd_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Переменные в proxy_pass заставляют nginx резолвить имя на каждый запрос:
  # пересозданный контейнер с новым IP не ломает шлюз.
  set $web      http://web:3000;
  set $keycloak http://keycloak:8080;
  set $mailpit  http://mailpit:8025;
  set $epa      http://epa:8080;

  location = /gateway-health {
    access_log off;
    return 200 "ok\n";
  }

  # Вход и выбор роли обрабатывает Nuxt (nuxt-oidc-auth).
  location ^~ /auth/keycloak/ { proxy_pass $web; }
  location ^~ /auth/role      { proxy_pass $web; }

  # Страницы ФСП ID (Keycloak живёт под /auth).
  location ~ ^/auth/(realms|resources|js)(/|$) { proxy_pass $keycloak; }

  # Письма подтверждения почты (Mailpit, MP_WEBROOT=/mail).
  location ^~ /mail { proxy_pass $mailpit; }

  # EPA: API, git и расширение.
  location ~ ^/(v1|git|extension)(/|$) { proxy_pass $epa; }

  # Всё остальное, включая /auth (страница входа) и /api (Nuxt проксирует в API), — веб.
  location / { proxy_pass $web; }
}
