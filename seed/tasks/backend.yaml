- id: backend-code-01
  specialization: backend
  kind: code
  skills:
  - python
  - go
  difficulty: 2
  body: 'На стандартный ввод подаются два целых числа — размеры двух ответов API. Напечатайте их сумму. Язык: Python или Go.'
  tests_public:
  - stdin: '2 3

      '
    expected: '5

      '
  - stdin: '10 1

      '
    expected: '11

      '
  tests_hidden:
  - stdin: '801 208

      '
    expected: '1009

      '
  - stdin: '-15 4

      '
    expected: '-11

      '
  languages:
  - python
  - go
  solutions:
    python: 'import sys

      a, b = map(int, sys.stdin.read().split())

      print(a + b)

      '
    go: "package main\n\nimport \"fmt\"\n\nfunc main() {\n    var a, b int\n    fmt.Scan(&a, &b)\n    fmt.Println(a + b)\n\
      }\n"
- id: backend-code-02
  specialization: backend
  kind: code
  skills:
  - postgresql
  difficulty: 3
  body: 'Первая строка — целое n. Вторая строка — n целых, это длительности запросов к PostgreSQL в миллисекундах. Напечатайте
    максимум. Язык: Python или Go.'
  tests_public:
  - stdin: '3

      1 7 4

      '
    expected: '7

      '
  tests_hidden:
  - stdin: '4

      -5 -2 -9 -1

      '
    expected: '-1

      '
  - stdin: '1

      42

      '
    expected: '42

      '
  languages:
  - python
  - go
  solutions:
    python: 'import sys

      data = [int(part) for part in sys.stdin.read().split()]

      count = data[0]

      print(max(data[1 : 1 + count]))

      '
    go: "package main\n\nimport \"fmt\"\n\nfunc main() {\n    var n int\n    fmt.Scan(&n)\n    var best int\n    for i :=\
      \ 0; i < n; i++ {\n        var value int\n        fmt.Scan(&value)\n        if i == 0 || value > best {\n          \
      \  best = value\n        }\n    }\n    fmt.Println(best)\n}\n"
