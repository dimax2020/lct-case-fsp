  body: Чем образ Docker отличается от контейнера?
  options:
  - id: a
    text: Это одно и то же
  - id: b
    text: Образ — шаблон файловой системы и команды, контейнер — запущенный экземпляр
  - id: c
    text: Контейнер хранится в registry, образ всегда только в памяти
  - id: d
    text: Образ нельзя использовать для запуска больше одного контейнера
  answer: b
  languages: []
