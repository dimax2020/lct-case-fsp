  difficulty: 2
  body: Чем COPY в Dockerfile отличается от bind-mount при запуске?
  options:
  - id: a
    text: Ничем, оба читают каталог хоста при каждом запросе
  - id: b
    text: COPY кладёт файлы в образ на сборке, bind-mount подменяет каталог уже у запущенного контейнера
  - id: c
    text: COPY работает только для каталогов больше 1 ГБ
  - id: d
    text: Bind-mount меняет слои образа в registry
  answer: b
