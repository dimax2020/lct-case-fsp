- id: devops-code-01
  specialization: devops
  kind: code
  skills:
  - go
  - docker
  difficulty: 2
  body: 'На стандартный ввод подаются два целых числа — число реплик двух сервисов. Напечатайте их сумму. Язык: Python или
    Go.'
  tests_public:
